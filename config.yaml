agents_api:
  enabled: false
checkpointer:
  connection_string: checkpoints.db
  type: sqlite
circuit_breaker:
  failure_threshold: 5
  recovery_timeout_sec: 60
config_version: 7
knowledge:
  chunk_size: 500
  embed_model: nomic-embed-text
  faiss_index_path: /app/knowledge/faiss_index
  ollama_base_url: http://host.docker.internal:11434
  overlap_size: 50
  parse_model: gemma4:e2b
  parse_prompt: '你是一个文档解析专家。请将以下文本内容解析为结构化数据。
    返回一个JSON数组，每个元素是一个对象，包含以下字段：
    - "title": 该段的标题或主题
    - "keywords": 关键词列表（数组）
    - "content": 该段的主要内容（保持原文，不要改写），包括title和keywords信息
    严格只输出JSON数组，不要包含任何其他文字。
    文本内容：
    {text}
    '
  rerank_api_url: http://reranker:7997/rerank
  rerank_model: BAAI/bge-reranker-v2-m3
  score_threshold: 0.5
  supported_file_types:
  - pdf
  - csv
  - md
  - docx
  - txt
  vector_top_k: 5
log_level: info
memory:
  debounce_seconds: 60
  enabled: true
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_facts: 30
  max_injection_tokens: 2000
  model_name: deepseek-v4-flash
  storage_path: memory.json
models:
- api_base: https://ark.cn-beijing.volces.com/api/v3
  api_key: $VOLCENGINE_API_KEY
  display_name: Doubao-Seed-1.8
  max_retries: 2
  model: doubao-seed-1-8-251228
  name: doubao-seed-1.8
  supports_reasoning_effort: true
  supports_thinking: true
  supports_vision: true
  timeout: 600.0
  use: optclaw.models.patched_deepseek:PatchedChatDeepSeek
  when_thinking_disabled:
    extra_body:
      thinking:
        type: disabled
  when_thinking_enabled:
    extra_body:
      thinking:
        type: enabled
- base_url: http://host.docker.internal:11434
  display_name: Gemma 4 E2B (Ollama Fast)
  model: gemma4:e2b
  name: gemma4-e2b-local
  num_predict: 8192
  reasoning: true
  supports_thinking: true
  supports_vision: true
  temperature: 1.0
  use: langchain_ollama:ChatOllama
- name: qwen3.5-9b-local
  display_name: Qwen3.5 9B (Ollama)
  use: langchain_ollama:ChatOllama
  model: qwen3.5:9b
  base_url: http://host.docker.internal:11434   # No /v1 suffix — uses native /api/chat
  num_predict: 8192
  temperature: 0.7
  reasoning: true                    # Passes think:true to Ollama native API
  supports_thinking: true
  supports_vision: false
- api_key: $DEEPSEEK_API_KEY
  display_name: Deepseek-V4-Flash (Thinking)
  max_retries: 2
  max_tokens: 32768
  model: deepseek-v4-flash
  name: deepseek-v4-flash
  supports_thinking: true
  supports_vision: false
  timeout: 600.0
  use: optclaw.models.patched_deepseek:PatchedChatDeepSeek
  when_thinking_disabled:
    extra_body:
      thinking:
        type: disabled
  when_thinking_enabled:
    extra_body:
      thinking:
        type: enabled
skill_evolution:
  enabled: false
  moderation_model_name: null
skills:
  container_path: /mnt/skills
subagents:
  agents:
    coder:
      max_turns: 80
      timeout_seconds: 300
    general-purpose:
      max_turns: 160
      timeout_seconds: 1800
  timeout_seconds: 900
summarization:
  enabled: true
  keep:
    type: messages
    value: 10
  model_name: doubao-seed-1.8
  summary_prompt: null
  trigger:
  - type: tokens
    value: 20000
  trim_tokens_to_summarize: 15564
title:
  enabled: true
  max_chars: 60
  max_words: 6
  model_name: doubao-seed-1.8
token_usage:
  enabled: false
tool_groups:
- name: web
- name: file:read
- name: file:write
tool_search:
  enabled: false
tools:
- api_key: $TAVILY_API_KEY
  group: web
  max_results: 5
  name: web_search
  use: optclaw.community.tavily.tools:web_search_tool
uploads:
  pdf_converter: auto
