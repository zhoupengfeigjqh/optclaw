config_version: 7
log_level: info
token_usage:
  enabled: false
models:
- name: doubao-seed-1.8
  display_name: Doubao-Seed-1.8
  use: optclaw.models.patched_deepseek:PatchedChatDeepSeek
  model: doubao-seed-1-8-251228
  api_base: https://ark.cn-beijing.volces.com/api/v3
  api_key: $VOLCENGINE_API_KEY
  timeout: 600.0
  max_retries: 2
  supports_thinking: true
  supports_vision: true
  supports_reasoning_effort: true
  when_thinking_enabled:
    extra_body:
      thinking:
        type: enabled
  when_thinking_disabled:
    extra_body:
      thinking:
        type: disabled
- name: deepseek-v4-flash
  display_name: Deepseek-V4-Flash (Thinking)
  use: optclaw.models.patched_deepseek:PatchedChatDeepSeek
  model: deepseek-v4-flash
  api_key: $DEEPSEEK_API_KEY
  timeout: 600.0
  max_retries: 2
  max_tokens: 32768
  supports_thinking: true
  supports_vision: false
  when_thinking_enabled:
    extra_body:
      thinking:
        type: enabled
  when_thinking_disabled:
    extra_body:
      thinking:
        type: disabled
tool_groups:
- name: web
- name: file:read
- name: file:write
- name: bash
tools:
- name: web_search
  group: web
  use: optclaw.community.tavily.tools:web_search_tool
  max_results: 5
  api_key: $TAVILY_API_KEY
tool_search:
  enabled: false
uploads:
  pdf_converter: auto
subagents:
  timeout_seconds: 900
  agents:
    general-purpose:
      timeout_seconds: 1800
      max_turns: 160
    coder:
      timeout_seconds: 300
      max_turns: 80
skills:
  container_path: /mnt/skills
title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: doubao-seed-1.8
summarization:
  enabled: true
  model_name: doubao-seed-1.8
  trigger:
  - type: tokens
    value: 20000
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 15564
  summary_prompt: null
memory:
  enabled: true
  storage_path: memory.json
  debounce_seconds: 300
  model_name: deepseek-v4-flash
  max_facts: 30
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 1000
agents_api:
  enabled: false
skill_evolution:
  enabled: false
  moderation_model_name: null
checkpointer:
  type: sqlite
  connection_string: checkpoints.db
circuit_breaker:
  failure_threshold: 5
  recovery_timeout_sec: 60
