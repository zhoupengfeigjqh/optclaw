services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optclaw-api
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env:ro
      - ./config.yaml:/app/config.yaml
      - ./skills:/app/skills
      - optclaw-data:/app/optclaw/.opt-claw
    env_file:
      - .env
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: optclaw-frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    container_name: optclaw-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: optclaw
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  optclaw-data:
  mongo-data:
