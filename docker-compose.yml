services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optclaw-api
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env:ro
      - ./config.yaml:/app/config.yaml
      - ./skills:/app/skills
      - optclaw-data:/app/optclaw/.opt-claw
      - faiss-data:/app/knowledge/faiss_index
    env_file:
      - .env
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: optclaw-frontend
    ports:
      - "85:80"
    depends_on:
      - api
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    container_name: optclaw-mongo
    command: --wiredTigerEngineConfigString "checkpoint=(wait=300)"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: optclaw
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  reranker:
    image: michaelf34/infinity:0.0.72
    container_name: optclaw-reranker
    ports:
      - "7997:7997"
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
    command:
      - "v2"
      - "--model-id"
      - "BAAI/bge-reranker-v2-m3"
      - "--port"
      - "7997"
    volumes:
      - reranker-cache:/app/.cache
    restart: unless-stopped

volumes:
  optclaw-data:
  mongo-data:
  faiss-data:
  reranker-cache:
